[package]
name = "flux-client"
version = "0.1.0"
edition = "2021"
description = "Sample Rust client for the FLUX image generator REST API (/api/v1)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[[bin]]
name = "flux"
path = "src/main.rs"
