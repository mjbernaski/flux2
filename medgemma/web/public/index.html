<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedGemma Chat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1a1b26;
    padding: 14px 20px;
    border-bottom: 1px solid #2a2b3d;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 18px; font-weight: 600; color: #7aa2f7; }
  header span { font-size: 13px; color: #565f89; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #283457;
    color: #c0caf5;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #1a1b26;
    color: #c0caf5;
    border: 1px solid #2a2b3d;
    border-bottom-left-radius: 4px;
  }
  .msg img.thumb {
    max-width: 200px;
    max-height: 150px;
    border-radius: 8px;
    margin-bottom: 8px;
    display: block;
  }

  .spinner {
    align-self: flex-start;
    padding: 12px 16px;
    color: #565f89;
    font-size: 14px;
  }
  .spinner::after {
    content: "";
    animation: dots 1.4s infinite;
  }
  @keyframes dots {
    0%   { content: ""; }
    25%  { content: "."; }
    50%  { content: ".."; }
    75%  { content: "..."; }
  }

  #input-area {
    background: #1a1b26;
    border-top: 1px solid #2a2b3d;
    padding: 12px 16px;
  }

  #drop-zone {
    border: 2px dashed #2a2b3d;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 10px;
    text-align: center;
    font-size: 13px;
    color: #565f89;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    display: none;
  }
  #drop-zone.visible { display: block; }
  #drop-zone.dragover {
    border-color: #7aa2f7;
    background: rgba(122,162,247,0.08);
  }

  #image-preview {
    display: none;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding: 8px 12px;
    background: #16161e;
    border-radius: 8px;
  }
  #image-preview.visible { display: flex; }
  #image-preview img {
    max-width: 80px;
    max-height: 60px;
    border-radius: 6px;
  }
  #image-preview .name { flex: 1; font-size: 13px; color: #9aa5ce; }
  #image-preview button {
    background: none;
    border: none;
    color: #f7768e;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }

  #form {
    display: flex;
    gap: 8px;
  }

  #toggle-upload {
    background: #283457;
    border: none;
    color: #7aa2f7;
    font-size: 20px;
    width: 42px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #toggle-upload:hover { background: #2a3a5c; }

  #msg-input {
    flex: 1;
    background: #16161e;
    border: 1px solid #2a2b3d;
    border-radius: 8px;
    padding: 10px 14px;
    color: #c0caf5;
    font-size: 14px;
    outline: none;
    resize: none;
    min-height: 42px;
    max-height: 120px;
    font-family: inherit;
  }
  #msg-input:focus { border-color: #7aa2f7; }

  #send-btn {
    background: #7aa2f7;
    border: none;
    color: #1a1b26;
    font-weight: 600;
    font-size: 14px;
    padding: 0 18px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:hover { background: #89b4fa; }
  #send-btn:disabled { opacity: 0.4; cursor: default; }

  #file-input { display: none; }
</style>
</head>
<body>

<header>
  <h1>MedGemma Chat</h1>
  <span>Medical image analysis</span>
</header>

<div id="chat"></div>

<div id="input-area">
  <div id="drop-zone">
    Drop an image here, or click to browse
  </div>

  <div id="image-preview">
    <img id="preview-img" src="" alt="preview">
    <span class="name" id="preview-name"></span>
    <button id="remove-image" title="Remove image">&times;</button>
  </div>

  <div id="form">
    <button id="toggle-upload" title="Attach image">+</button>
    <textarea id="msg-input" rows="1" placeholder="Ask about a medical image..."></textarea>
    <button id="send-btn">Send</button>
  </div>
  <input type="file" id="file-input" accept="image/*">
</div>

<script>
const chatEl = document.getElementById("chat");
const msgInput = document.getElementById("msg-input");
const sendBtn = document.getElementById("send-btn");
const dropZone = document.getElementById("drop-zone");
const fileInput = document.getElementById("file-input");
const toggleUpload = document.getElementById("toggle-upload");
const imagePreview = document.getElementById("image-preview");
const previewImg = document.getElementById("preview-img");
const previewName = document.getElementById("preview-name");
const removeImageBtn = document.getElementById("remove-image");

let stagedImage = null;   // base64 string (no prefix)
let stagedName = "";
let messages = [];        // conversation history
let generating = false;

// -- Image handling --

function stageFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = () => {
    const b64 = reader.result.split(",")[1];
    stagedImage = b64;
    stagedName = file.name;
    previewImg.src = reader.result;
    previewName.textContent = file.name;
    imagePreview.classList.add("visible");
    dropZone.classList.remove("visible");
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  stagedImage = null;
  stagedName = "";
  previewImg.src = "";
  previewName.textContent = "";
  imagePreview.classList.remove("visible");
  fileInput.value = "";
}

toggleUpload.addEventListener("click", () => {
  if (dropZone.classList.contains("visible")) {
    dropZone.classList.remove("visible");
  } else {
    dropZone.classList.add("visible");
  }
});

dropZone.addEventListener("click", () => fileInput.click());

dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length) stageFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener("change", () => {
  if (fileInput.files.length) stageFile(fileInput.files[0]);
});

removeImageBtn.addEventListener("click", clearImage);

// Also allow dropping anywhere on the page
document.body.addEventListener("dragover", (e) => e.preventDefault());
document.body.addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.dataTransfer.files.length) stageFile(e.dataTransfer.files[0]);
});

// -- Chat --

function addMessage(role, text, imageDataUrl) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (imageDataUrl) {
    const img = document.createElement("img");
    img.src = imageDataUrl;
    img.className = "thumb";
    div.appendChild(img);
  }
  div.appendChild(document.createTextNode(text));
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showSpinner() {
  const div = document.createElement("div");
  div.className = "spinner";
  div.id = "loading-spinner";
  div.textContent = "Generating";
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function hideSpinner() {
  const el = document.getElementById("loading-spinner");
  if (el) el.remove();
}

async function send() {
  const text = msgInput.value.trim();
  if (!text || generating) return;

  const imageDataUrl = stagedImage ? previewImg.src : null;
  const imageB64 = stagedImage;

  addMessage("user", text, imageDataUrl);
  messages.push({ role: "user", content: text });
  msgInput.value = "";

  const payload = { messages: messages.map(m => ({ role: m.role, text: m.content })), image: imageB64 || null };
  clearImage();

  generating = true;
  sendBtn.disabled = true;
  showSpinner();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }
    const data = await res.json();
    messages.push({ role: "assistant", content: data.response });
    hideSpinner();
    addMessage("assistant", data.response);
  } catch (e) {
    hideSpinner();
    addMessage("assistant", "Error: " + e.message);
  } finally {
    generating = false;
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

sendBtn.addEventListener("click", send);
msgInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// Auto-resize textarea
msgInput.addEventListener("input", () => {
  msgInput.style.height = "auto";
  msgInput.style.height = msgInput.scrollHeight + "px";
});
</script>
</body>
</html>
